<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二重投票拒否の実通信テスト</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><body style="font-family:sans-serif;padding:24px"><h1>二重投票拒否の確認</h1><p>専用の架空選挙のみ。投票済みの確認後、同一認証で2回送信します。</p><button id="run" disabled>再送テストを実行</button><pre id="result" style="white-space:pre-wrap">LINE認証中</pre><script>
const apiUrl='https://script.google.com/macros/s/AKfycbwJAfuI1LJvgYPByaCxwGg3z_ksHUIlWabaNJdo_gTFtb2rbpTaQxpHH54GBwfx0fw/exec';
const output=document.getElementById('result'),button=document.getElementById('run');let token='';
async function api(action){const r=await fetch(apiUrl,{method:'POST',body:new URLSearchParams({action,idToken:token,electionId:'e2e_final_20260924',optionId:'a'})});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
(async()=>{try{await liff.init({liffId:'2010887632-qvHbczSI'});if(!liff.isInClient())throw Error('LINE内で開いてください');token=liff.getIDToken();if(!token)throw Error('認証情報なし');output.textContent='準備できました';button.disabled=false;}catch(e){output.textContent=e.message;}})();
button.onclick=async()=>{button.disabled=true;try{const before=await api('getPageState');if(before.ok!==true || before.state!=='already'){output.textContent='再送中止：投票済み状態の確認が必要です\n'+JSON.stringify({ok:before.ok,state:before.state,alreadyVoted:before.alreadyVoted});return;}const r=await Promise.all([api('castVote'),api('castVote')]);output.textContent=JSON.stringify(r.map((x,i)=>({request:i+1,ok:x.ok,alreadyVoted:x.alreadyVoted,error:x.error})),null,2);}catch(e){output.textContent=e.message;}};
</script></body></html>
